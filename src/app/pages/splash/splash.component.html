<div class="bg">
  <div class="container">
    <img class="img" src="assets/NOVO-brasão-PC-Ceará.png" />
    <h2>Sistema Numerador</h2>
    <div class="separate"></div>
    <!--LOGIN-->
    <div id="login_section">
      <!--login section-->
      <span class="label">CPF</span>
      <br />
      <input
        type="number"
        class="input_field"
        id="login"
        placeholder="Apenas números"
        inputmode="numeric"
        minlength="11"
        required
        maxlength="11"
        [(ngModel)]="cpf"
      />
      <!--input form to login-->
      <br />
    </div>
    <br />
    <!--PASSWORD-->
    <div id="password_section">
      <!--password section-->
      <span class="label">Senha</span>
      <br />
      <input
        type="password"
        class="input_field"
        id="password"
        required
        minlength="6"
        required
        maxlength="12"
        [(ngModel)]="senha"
        (keyup.enter)="fazerLogin()"
      />
      <!--
      <div>
        <a href="https://www.google.com.br">
          <span class="link_texto">Esqueci minha senha</span>
        </a>
        <br />

        
        <span id="erro_senha">Senha incorreta!</span>
        
        <br />
        <br />
      </div>
      -->
    </div>

    <div class="separate-big"></div>
    <!--Enter button-->
    <button class="mainbutton" id="Enter" (click)="fazerLogin()">ENTRAR</button>
    <br />
    <br />
    <!--separation div-->
    <div class="separate-big"></div>

    <br />
    <!--separation div-->
    <div class="separate"></div>

    <img class="footer" src="assets/numerador_footer.svg" />
  </div>
</div>
