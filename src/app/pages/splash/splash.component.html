<div class="bg">
  <div class="container">
    <img class="img" src="assets/NOVO-brasão-PC-Ceará.png" />
    <h2>Sistema Numerador</h2>
    <div class="separate"></div>
    <!--LOGIN-->
    <div id="login_section">
      <!--login section-->
      <span class="label">CPF</span>
      <br />
      <input
        type="text"
        class="input_field"
        id="login"
        placeholder="Apenas números"
        inputmode="numeric"
        minlength="11"
        required
        maxlength="11"
      />
      <!--input form to login-->
      <br />
      <span id="erro_login">CPF inválido!</span>
      <div>
        <!-- <input type="checkbox" class="remember_user_button"><span class="legenda">Lembrar meu usuário</span> -->
      </div>
    </div>

    <!--separation div-->
    <div class="separate-mini"></div>

    <!--PASSWORD-->
    <div id="password_section">
      <!--password section-->
      <span class="label">Senha</span>
      <br />
      <input
        type="password"
        class="input_field"
        id="password"
        placeholder=""
        required
        minlength="6"
        required
        maxlength="12"
      />
      <div>
        <a href="https://www.google.com.br">
          <span class="link_texto">Esqueci minha senha</span>
        </a>
        <br />
        <!--forgot my password button-->
        <span id="erro_senha">Senha incorreta!</span>
        <br />
        <br />
      </div>
    </div>

    <div class="separate"></div>
    <!--Enter button-->
    <button class="mainbutton" id="Enter" (click)="navDashboard()">
      ENTRAR
    </button>
    <br />
    <br />
    <!--separation div-->
    <div class="separate-big"></div>
    <h4>Primeiro acesso? Então,</h4>
    <br />
    <button class="mainbutton" id="Cadastro" (click)="navDashboard()">
      Cadastre-se
    </button>
    <!--separation div-->
    <div class="separate"></div>

    <img class="footer" src="assets/numerador_footer.svg" />
  </div>
</div>
