<div class="conteudo">
  <table id="document-types">
    <thead>
      <tr class="primeiro-header">
        <th colspan="4">Tipos de Documentos</th>
      </tr>
    </thead>
    <tbody class="corpo_tabela">
      @for (item of listaDocumentos; track item.id) {
        <tr>
          <td class="nome-documento">{{ item.nomeTipoDocumento }}</td>
          <td>
            <label class="switch">
              <input
                type="checkbox"
                [checked]="item.status === 'ATIVO'"
                (change)="toggleStatus(item)"
              />
              <span class="slider round"></span>
            </label>
          </td>
          <td>
            <app-botao
              [texto]="'Editar'"
              id="bt-editar"
              (click)="editar(item)"
            ></app-botao>
          </td>
          <td>
            <app-botao
              [texto]="'Excluir'"
              id="bt_excluir"
              (click)="excluir(item.id)"
            ></app-botao>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4">Nenhum documento cadastrado.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
