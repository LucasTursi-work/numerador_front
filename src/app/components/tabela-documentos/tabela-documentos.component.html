<div class="conteudo">
  <table id="document-types">
    <thead>
      <tr class="primeiro-header">
        <th colspan="3">Tipos de Documentos</th>
      </tr>
    </thead>
    <tbody class="corpo_tabela">
      @for (item of listaDocumentos; track item.id) {
        <tr>
          <td class="nome-documento">{{ item.nome }}</td>
          @if (ehAdmin) {
            <td>
              <label class="switch">
                <input
                  type="checkbox"
                  [checked]="item.status === 'ATIVO'"
                  (change)="toggleStatus(item)"
                  class="icon"
                />
                <span class="slider"></span>
              </label>
            </td>
          }
          <td>
            @if (ehAdmin) {
              <div class="edicao">
                <!-- Passamos o objeto 'item' completo para editar -->
                <button id="bt_editar" (click)="editar(item)">Editar</button>
                <!-- Passamos apenas o 'item.id' para excluir -->
                <button id="bt_excluir" (click)="excluir(item.id)">
                  Excluir
                </button>
              </div>
            }
          </td>
        </tr>
      }
    </tbody>
  </table>
  <p class="contador-itens">{{ listaDocumentos.length }} itens carregados.</p>
</div>
