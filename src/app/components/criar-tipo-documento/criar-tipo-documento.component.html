<div class="container">
  <h6 style="font-weight: bold">Criar novo tipo de documento</h6>
  <div class="separador-mini"></div>
  <span>Digite o tipo do documento:</span>
  <br />
  <input type="text" [(ngModel)]="tipoDocumento" />
  <br />
  <br />
  <span>Selecione o cartório:</span>
  <br />
  <select
    class="select"
    placeholder="selecione..."
    [(ngModel)]="cartorioSelecionadoId"
  >
    <option [ngValue]="null" disabled selected>Selecione um cartório</option>

    <option *ngFor="let cartorio of cartorios$ | async" [ngValue]="cartorio.id">
      {{ cartorio.nome }}
    </option>
  </select>
  <div class="separador-mini"></div>
  <div class="button-container">
    <button
      (click)="cadastrar()"
      [disabled]="!tipoDocumento || !cartorioSelecionadoId"
    >
      Cadastrar
    </button>
  </div>
</div>
