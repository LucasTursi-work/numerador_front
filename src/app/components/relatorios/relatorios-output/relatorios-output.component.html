<div
  class="dashboard-resultado"
  *ngIf="relatoriosService.resultado$ | async as dados"
>
  <div class="grafico-box">
    <h3>GRÁFICO DOCUMENTOS</h3>
    <canvas
      baseChart
      [data]="getChartData(dados.graficoDocumentos)"
      [options]="pieChartOptions"
      [type]="pieChartType"
    >
    </canvas>
  </div>

  <div class="grafico-box">
    <h3>GRÁFICO CARTÓRIOS</h3>
    <canvas
      baseChart
      [data]="getChartData(dados.graficoCartorios)"
      [options]="pieChartOptions"
      [type]="pieChartType"
    >
    </canvas>
  </div>
</div>

<div class="exportar-container">
  <div class="grupo-formato">
    <label for="formatoSelect">Formato:</label>
    <select id="formatoSelect" #formatoInput class="select-formato">
      <option value="pdf">PDF (.pdf)</option>
      <option value="csv">CSV (.csv)</option>
    </select>
  </div>

  <button
    type="button"
    class="btn-exportar"
    (click)="exportar(formatoInput.value)"
  >
    Exportar Relatório
  </button>
</div>
