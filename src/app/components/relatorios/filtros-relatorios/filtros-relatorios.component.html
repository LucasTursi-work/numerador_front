<div class="filtros-container" [formGroup]="formFiltros">
  <div class="grupo-filtro">
    <label>Data Inicial</label>
    <input type="date" formControlName="dataInicial" class="input-data" />
  </div>

  <div class="grupo-filtro">
    <label>Data Final</label>
    <input type="date" formControlName="dataFinal" class="input-data" />
  </div>

  <!--DOCUMENTOS -->
  <mat-form-field
    appearance="outline"
    class="filtro-material"
    subscriptSizing="dynamic"
  >
    <mat-label>Tipo de Documento</mat-label>
    <mat-select
      formControlName="tiposDocumentoIds"
      multiple
      panelClass="dropdown-relatorio-panel"
    >
      <mat-option *ngFor="let tipo of tiposDocumento" [value]="tipo.id">
        {{ tipo.nome }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <!--CARTORIOS -->
  <mat-form-field
    appearance="outline"
    class="filtro-material"
    subscriptSizing="dynamic"
  >
    <mat-label for="cartoriosIds">Cartório</mat-label>
    <mat-select
      formControlName="cartoriosIds"
      multiple
      panelClass="dropdown-relatorio-panel"
    >
      <mat-option *ngFor="let cartorio of cartorios" [value]="cartorio.id">
        {{ cartorio.nome }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <!--USUARIOS -->
  <mat-form-field
    appearance="outline"
    class="filtro-material"
    subscriptSizing="dynamic"
  >
    <mat-label for="usuariosIds">Usuários</mat-label>
    <mat-select
      formControlName="usuariosIds"
      multiple
      panelClass="dropdown-relatorio-panel"
    >
      <mat-option *ngFor="let user of usuarios" [value]="user.id">
        {{ user.nome }}
      </mat-option>
    </mat-select>
  </mat-form-field>
