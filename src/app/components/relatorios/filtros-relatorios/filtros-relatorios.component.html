<div class="filtros-container" [formGroup]="formFiltros">
  <div class="grupo-filtro">
    <label>Data Inicial</label>
    <input type="date" formControlName="dataInicial" class="input-data" />
  </div>

  <div class="grupo-filtro">
    <label>Data Final</label>
    <input type="date" formControlName="dataFinal" class="input-data" />
  </div>

  <div class="grupo-filtro">
    <label>Tipo de Documento</label>
    <div class="dropdown-customizado">
      <button
        class="btn-dropdown"
        type="button"
        (click)="toggleMenu('doc', $event)"
      >
        Selecionar Tipos
        <span class="seta-dropdown">▼</span>
      </button>
      <div class="menu-dropdown-itens" [class.aberto]="menuAberto === 'doc'">
        <div *ngIf="tiposDocumento.length === 0" class="dropdown-vazio">
          Nenhum tipo encontrado
        </div>

        <label *ngFor="let tipo of tiposDocumento" class="checkbox-item">
          <input
            type="checkbox"
            [checked]="isCheckboxSelecionado('tiposDocumentoIds', tipo.id)"
            (change)="onCheckboxChange('tiposDocumentoIds', tipo.id)"
          />
          {{ tipo.nome }}
        </label>
      </div>
    </div>
  </div>

  <div class="grupo-filtro">
    <label>Cartórios</label>
    <div class="dropdown-customizado">
      <button
        class="btn-dropdown"
        type="button"
        (click)="toggleMenu('cartorio', $event)"
      >
        Selecionar Cartórios
        <span class="seta-dropdown">▼</span>
      </button>
      <div
        class="menu-dropdown-itens"
        [class.aberto]="menuAberto === 'cartorio'"
      >
        <div *ngIf="cartorios.length === 0" class="dropdown-vazio">
          Nenhum cartório encontrado
        </div>

        <label *ngFor="let cartorio of cartorios" class="checkbox-item">
          <input
            type="checkbox"
            [checked]="isCheckboxSelecionado('cartoriosIds', cartorio.id)"
            (change)="onCheckboxChange('cartoriosIds', cartorio.id)"
          />
          {{ cartorio.nome }}
        </label>
      </div>
    </div>
  </div>

  <div class="grupo-filtro">
    <label>Usuários</label>
    <div class="dropdown-customizado">
      <button
        class="btn-dropdown"
        type="button"
        (click)="toggleMenu('usuario', $event)"
      >
        Selecionar Usuários
        <span class="seta-dropdown">▼</span>
      </button>
      <div
        class="menu-dropdown-itens"
        [class.aberto]="menuAberto === 'usuario'"
      >
        <div *ngIf="usuarios.length === 0" class="dropdown-vazio">
          Nenhum usuário encontrado
        </div>

        <label *ngFor="let user of usuarios" class="checkbox-item">
          <input
            type="checkbox"
            [checked]="isCheckboxSelecionado('usuariosIds', user.id)"
            (change)="onCheckboxChange('usuariosIds', user.id)"
          />
          {{ user.nome }}
        </label>
      </div>
    </div>
  </div>

  <button class="btn-gerar" type="button" (click)="emitirBusca()">
    Gerar Relatório
  </button>
</div>
