<!-- criar-usuario.component.html -->
<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <!-- Campo Nome -->
  <div>
    <label>Nome:</label>
    <input type="text" formControlName="nome" />
    <small *ngIf="form.get('nome')?.hasError('required')"
      >Campo obrigatório</small
    >
    <small *ngIf="form.get('nome')?.hasError('minlength')">
      Mínimo 3 caracteres
    </small>
  </div>
  <div class="separador-mini"></div>
  <!-- Campo CPF -->
  <div>
    <label>CPF:</label>
    <input
      type="text"
      formControlName="cpf"
      (input)="formatarCpf($event)"
      maxlength="14"
      placeholder="000.000.000-00"
    />
    <small *ngIf="form.get('cpf')?.hasError('required')"
      >Campo obrigatório</small
    >
    <small *ngIf="form.get('cpf')?.hasError('pattern')">
      CPF deve ter 11 dígitos
    </small>
  </div>
  <div class="separador-mini"></div>
  <!-- Campo Email -->
  <div>
    <label>Email:</label>
    <input type="email" formControlName="email" />
    <small *ngIf="form.get('email')?.hasError('required')"
      >Campo obrigatório</small
    >
    <small *ngIf="form.get('email')?.hasError('email')"> Email inválido </small>
  </div>
  <div class="separador-mini"></div>
  <!-- Campo Senha -->
  <div>
    <label>Senha:</label>
    <input type="password" formControlName="senha" />
    <small *ngIf="form.get('senha')?.hasError('required')"
      >Campo obrigatório</small
    >
    <small *ngIf="form.get('senha')?.hasError('minlength')">
      Mínimo 6 caracteres
    </small>
  </div>
  <div class="separador-mini"></div>
  <!-- Select Perfil -->
  <div>
    <label>Perfil:</label>
    <select formControlName="perfil">
      <option *ngFor="let perfil of perfis" [value]="perfil">
        {{ perfil }}
      </option>
    </select>
  </div>
  <div class="separador"></div>
  <!-- Botão Submit -->
  <button type="submit" [disabled]="form.invalid">Cadastrar Usuário</button>
</form>
