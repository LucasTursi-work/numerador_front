<table id="miatablea">
  <thead class="cabeçalho">
    <tr>
      <th scope="col">#</th>
      <th scope="col">Nome do documento</th>
      <th scope="col">Contagem</th>
      <th scope="col">Botão</th>
    </tr>
  </thead>
  <tbody class="corpo_tabela">
    <tr *ngIf="documentos.length === 0">
      <td colspan="4">Carregando documentos ou nenhum documento encontrado.</td>
    </tr>
    <tr *ngFor="let documento of documentos; let i = index">
      <td class="col" id="index">{{ i + 1 }}</td>
      <td class="col">{{ documento.tipoDocumento?.nome }}</td>
      <td class="col">{{ documento.numero }}</td>
      <td>
        <app-botao [texto]="'Gerar'" (click)="gerarDocumento(i)"></app-botao>
      </td>
    </tr>
  </tbody>
</table>
