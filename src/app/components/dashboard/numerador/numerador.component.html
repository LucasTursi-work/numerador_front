<table id="miatablea">
  <thead>
    <tr class="primeiro-header">
      <th colspan="6">Numerador</th>
    </tr>
    <tr class="segundo-header">
      <th scope="col">#</th>
      <th scope="col">Nome do documento</th>
      <th scope="col">Cartório</th>
      <th scope="col">Contagem</th>
      <th scope="col">Botão</th>
    </tr>
  </thead>
  <tbody class="corpo_tabela">
    <ng-container *ngIf="documentos$ | async as documentos">
      <tr *ngIf="documentos.length === 0">
        <td colspan="6">
          Carregando documentos ou nenhum documento encontrado.
        </td>
      </tr>

      <tr *ngFor="let documento of documentos; let i = index">
        <td class="col" id="index">{{ i + 1 }}</td>
        <td class="col">{{ documento.nome }}</td>
        <td class="col">
          <select #cartorioSelect class="opcao-item">
            <option [value]="null" disabled selected>
              Selecione um cartório...
            </option>
            <option *ngFor="let cartorio of cartorios" [value]="cartorio.id">
              {{ cartorio.nome }}
            </option>
          </select>
        </td>
        <td class="col">{{ obterContagemDocumento(documento.nome) }}</td>
        <td>
          <app-botao
            [texto]="'Gerar'"
            (click)="gerarDocumento(documento, cartorioSelect.value)"
          ></app-botao>
        </td>
      </tr>
    </ng-container>
  </tbody>
</table>
