<table id="logs">
  <thead>
    <tr class="primeiro-header">
      <th colspan="1">Logs</th>
    </tr>
    <tr class="segundo-header">
      <th scope="col">Data</th>
      <th scope="col">Nome de usuário</th>
      <th scope="col">Cartório</th>
      <th scope="col">Tipo de Documento</th>
    </tr>
  </thead>
  <tbody class="corpo_tabela">
    <tr *ngIf="logs.length === 0">
      <td colspan="4">Nenhum log encontrado.</td>
    </tr>
    <tr *ngFor="let log of logs">
      <td>{{ log.dataCadastro }}</td>
      <td>{{ log.nomeUsuario }}</td>
      <td>{{ log.cartorioId }}</td>
      <td>{{ log.tipoDocumentoId }}</td>
    </tr>
  </tbody>
</table>
