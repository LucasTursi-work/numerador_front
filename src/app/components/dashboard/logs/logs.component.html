<table id="logs">
  <thead>
    <tr class="primeiro-header">
      <th colspan="5">Logs</th>
    </tr>
    <tr class="segundo-header">
      <th scope="col">Horário</th>
      <th scope="col">Data</th>
      <th scope="col">Nome de usuário</th>
      <th scope="col">Cartório</th>
      <th scope="col">Ação</th>
    </tr>
  </thead>
  <tbody class="corpo_tabela">
    <tr *ngIf="logs.length === 0">
      <td colspan="5">Nenhum log encontrado.</td>
    </tr>
    <tr *ngFor="let log of logs">
      <td>{{ log.dataCadastro | date: "HH:mm" }}</td>

      <td>{{ log.dataCadastro | date: "dd/MM/yyyy" }}</td>

      <td>{{ log.nomeUsuario || "Sistema" }}</td>

      <td>{{ log.cartorioId }}</td>

      <td>Criado documento "{{ log.nomeTipoDocumento }}"</td>
    </tr>
  </tbody>
</table>
