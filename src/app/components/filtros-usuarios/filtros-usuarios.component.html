<button id="add-user" class="botao" (click)="onAdicionar()">
  Adicionar usuário
</button>

<form (ngSubmit)="aplicarFiltros()" class="filtros-container">
  <div class="name-form-container">
    <label>Nome</label><br />
    <input
      [(ngModel)]="nome"
      name="nome"
      placeholder="Nome"
      class="textField"
    />
  </div>
  <div class="cpf-form-container">
    <label>CPF</label><br />
    <input [(ngModel)]="cpf" name="cpf" placeholder="CPF" class="textField" />
  </div>
  <div class="box-perfil-container">
    <label>Perfil</label><br />
    <select [(ngModel)]="perfil" name="perfil" class="selector">
      <option value="" disabled selected hidden>Perfil</option>
      <option *ngFor="let p of perfilOptions" [value]="p">{{ p }}</option>
    </select>
  </div>
  <div class="box-status-container">
    <label>Status</label><br />
    <select [(ngModel)]="status" name="status" class="selector">
      <option value="" disabled selected hidden>Status</option>
      <option *ngFor="let s of statusOptions" [value]="s">{{ s }}</option>
    </select>
  </div>

  <button type="submit" class="botao" id="filtrar" (click)="aplicarFiltros()">
    Filtrar
  </button>
  <button type="button" (click)="limparFiltros()" class="botao limpar">
    Limpar filtros
  </button>
</form>
<div class="separador-mini"></div>
