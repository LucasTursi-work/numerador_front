<div class="container" [formGroup]="form">
  <h3>Editar usuário {{ usuario.nome }}</h3>
  <br />
  <div>
    <label>Nome</label><br />
    <input type="text" formControlName="nome" class="ipt_lg" />
  </div>

  <div>
    <label>E-mail</label><br />
    <input type="email" formControlName="email" class="ipt_lg" />
  </div>

  <div class="row-selects">
    <label>Tipo de usuário</label><br />
    <select formControlName="perfil" class="ipt_sm">
      <option *ngFor="let p of perfis" [value]="p">{{ p }}</option>
    </select>
  </div>
  <br />
  <div class="footer-btns">
    <button
      type="submit"
      (click)="salvar()"
      [disabled]="form.invalid"
      class="btn-save"
    >
      Salvar Alterações
    </button>
    <button type="button" (click)="activeModal.dismiss()" id="cancelar">
      Cancelar
    </button>
  </div>
</div>
