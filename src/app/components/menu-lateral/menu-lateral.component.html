<div class="container-content">
  <div>
    <br />
    <h4 style="padding-left: 0.2rem; font-weight: bold">Menu</h4>
    <div class="separador-mini"></div>

    <button class="botao" (click)="navDashboard()">Dashboard</button>
    <br />
    <br />
    <button class="botao" (click)="navListaUsuarios()">Usuarios</button>
    <br />
    <br />
    <button class="botao" (click)="navTiposDocumentos()">
      Tipos de Documentos
    </button>
    <br />
    <br />
    <button class="botao" (click)="navCartCad()">Cartórios Cadastrados</button>
    <br />
    <br />
    <button class="botao" (click)="navRelatorios()">Relatórios</button>
  </div>
  @if (ehAdmin) {
    <div>
      <span> Opções</span>
      <br />
      <button
        class="botao"
        (click)="navModalDocumento()"
        style="font-size: 0.8rem"
      >
        Cadastrar Documento
      </button>
      <br />
      <button
        class="botao"
        (click)="navModalCartorio()"
        style="font-size: 0.8rem"
      >
        Cadastrar Cartório
      </button>
    </div>
  }
  <div class="separador"></div>
  <div>
    <span>Você está logado como:</span>
    <br />
    <span class="nome-usuario">{{ nomeUsuario }}</span>
    <br />
    <button class="botao sair" (click)="navLogOut()">Sair</button>
  </div>
</div>
