<app-filtros-usuarios
  (filtrosAplicados)="aplicarFiltros($event)"
  (adicionar)="abrirModalAdicionarUsuario()"
></app-filtros-usuarios>
<app-tabela-usuarios
  [usuarios]="usuariosPaginados"
  [totalElementos]="totalElementos"
  [paginaAtual]="parametros.pagina + 1"
  [itensPorPagina]="parametros.limite"
  (mudarPagina)="mudarPagina($event)"
  class="tabela"
  (editar)="abrirModalEdicao($event)"
  (excluir)="abrirModalExclusao($event)"
>
</app-tabela-usuarios>
