<p>grade works!</p>

<table class="table table-sm table-striped table-bordered table-hover">
  <thead class="thead-dark">
    <tr>
      <th scope="col">#</th>
      <th scope="col">Nome do documento</th>
      <th scope="col">Contagem</th>
      <th scope="col">Botão</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let documento of documentos; let i = index">
      <td>{{ i + 1 }}</td>
      <td>{{ documento.name }}</td>
      <td>{{ documento.counter }}</td>
      <td>
        <app-botao [texto]="'Gerar'" (aoClicar)="gerarDocumento(i)"></app-botao>
      </td>
    </tr>
  </tbody>
</table>
