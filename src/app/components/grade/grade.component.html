<table id="miatablea">
  <thead class="cabeçalho">
    <tr>
      <th scope="col">#</th>
      <th scope="col">Nome do documento</th>
      <th scope="col">Contagem</th>
      <th scope="col">Botão</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let documento of documentos; let i = index">
      <td class="col" id="index">{{ i + 1 }}</td>
      <td class="col">{{ documento.nome }}</td>
      <td class="col">{{ documento.contador }}</td>
      <td>
        <app-botao [texto]="'Gerar'" (aoClicar)="gerarDocumento(i)"></app-botao>
      </td>
    </tr>
  </tbody>
</table>
